name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build-sim:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build Simulator
        run: |
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || \
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  analyze:
    name: Clang Static Analysis
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Analyze
        run: |
          xcodebuild analyze \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --report html \
              --output clang-analysis-report.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-analysis-report
          path: clang-analysis-report.html
          if-no-files-found: ignore
          retention-days: 14

  build-ipa:
    name: Build Unsigned IPA (device)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      # xcodebuild archive ALWAYS requires a signing identity even with
      # CODE_SIGNING_ALLOWED=NO — fails with "** ARCHIVE FAILED **".
      # Fix: plain 'build' targeting generic/platform=iOS, then manually
      # zip .app into Payload/ to produce a valid unsigned IPA.
      - name: Build for device (unsigned arm64e)
        run: |
          BUILD_DIR="$RUNNER_TEMP/build"
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Package as unsigned IPA
        run: |
          BUILD_DIR="$RUNNER_TEMP/build"
          IPA_ROOT="$RUNNER_TEMP/ipa_root"
          IPA_OUT="$RUNNER_TEMP/KernelResearch-unsigned.ipa"

          APP_PATH=$(find "$BUILD_DIR" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in $BUILD_DIR"
            find "$BUILD_DIR" || true
            exit 1
          fi
          echo "[*] .app: $APP_PATH"

          mkdir -p "$IPA_ROOT/Payload"
          cp -r "$APP_PATH" "$IPA_ROOT/Payload/"

          cd "$IPA_ROOT"
          zip -r "$IPA_OUT" Payload/

          echo "[+] IPA:"
          ls -lh "$IPA_OUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KernelResearch-unsigned-ipa
          path: "${{ runner.temp }}/KernelResearch-unsigned.ipa"
          if-no-files-found: error
          retention-days: 14
