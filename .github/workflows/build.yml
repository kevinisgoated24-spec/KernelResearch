name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build-sim:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build Simulator
        run: |
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || \
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  analyze:
    name: Clang Static Analysis
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Analyze
        run: |
          xcodebuild analyze \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --report html \
              --output clang-analysis-report.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-analysis-report
          path: clang-analysis-report.html
          if-no-files-found: ignore
          retention-days: 14

  build-ipa:
    name: Build Unsigned IPA (device)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Archive unsigned arm64e
        run: |
          xcodebuild archive \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KernelResearch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/KernelResearch.xcarchive" \
            -name "*.app" | head -1)
          echo "[*] Found .app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa_root/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa_root/Payload/"
          cd "$RUNNER_TEMP/ipa_root"
          zip -r "$RUNNER_TEMP/KernelResearch-unsigned.ipa" Payload/
          echo "[+] IPA size:"
          ls -lh "$RUNNER_TEMP/KernelResearch-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: KernelResearch-unsigned-ipa
          path: "${{ runner.temp }}/KernelResearch-unsigned.ipa"
          if-no-files-found: error
          retention-days: 14
