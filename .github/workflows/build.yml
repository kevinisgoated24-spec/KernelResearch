name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build-sim:
    name: Build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || \
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  analyze:
    name: Clang Static Analysis
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Analyze
        run: |
          xcodebuild analyze \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --report html \
              --output clang-analysis-report.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-analysis-report
          path: clang-analysis-report.html
          if-no-files-found: ignore
          retention-days: 14

  build-ipa:
    name: Build Unsigned IPA (device)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      # Raw xcodebuild output — no xcpretty so errors are visible
      - name: Build for device (unsigned arm64e)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KernelResearch.xcodeproj \
            -scheme KernelResearch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            GENERATE_INFOPLIST_FILE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify bundle and package IPA
        run: |
          # Find the .app — Release-iphoneos subfolder
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -name "KernelResearch.app" -type d | head -1)

          echo "=== Bundle contents ==="
          ls -la "$APP_PATH/" || true

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found"
            find "$RUNNER_TEMP/DerivedData" -type d | head -40
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            ls -la "$APP_PATH/"
            exit 1
          fi

          echo "[+] Info.plist OK"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

          # Package
          IPA_ROOT="$RUNNER_TEMP/ipa_root"
          IPA_OUT="$RUNNER_TEMP/KernelResearch-unsigned.ipa"
          mkdir -p "$IPA_ROOT/Payload"
          cp -r "$APP_PATH" "$IPA_ROOT/Payload/"
          cd "$IPA_ROOT"
          zip -r "$IPA_OUT" Payload/
          echo "[+] IPA: $(du -sh "$IPA_OUT" | cut -f1)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KernelResearch-unsigned-ipa
          path: "${{ runner.temp }}/KernelResearch-unsigned.ipa"
          if-no-files-found: error
          retention-days: 14
