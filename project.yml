name: KernelResearch
options:
  bundleIdPrefix: com.kevinisgoated24spec
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SWIFT_OBJC_BRIDGING_HEADER: KernelResearch/KernelResearch-Bridging-Header.h
    OTHER_CFLAGS: "-Wno-deprecated-declarations"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1"
    # Xcode 14+ defaults GENERATE_INFOPLIST_FILE=YES which ignores INFOPLIST_FILE
    # and generates a minimal stub with no custom keys → invalid bundle.
    GENERATE_INFOPLIST_FILE: NO

targets:
  KernelResearch:
    type: application
    platform: iOS
    # Explicit info plist — XcodeGen uses the `info` key to wire INFOPLIST_FILE
    # AND exclude the plist from Compile Sources (which would double-process it)
    info:
      path: KernelResearch/Info.plist
    sources:
      - path: KernelResearch
        excludes:
          - "**/*.txt"
          - "**/*.md"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinisgoated24spec.KernelResearch
        CODE_SIGN_ENTITLEMENTS: KernelResearch/KernelResearch.entitlements
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - framework: System/Library/Frameworks/IOKit.framework
        implicit: true
    scheme:
      testTargets: []
      gatherCoverageData: false
